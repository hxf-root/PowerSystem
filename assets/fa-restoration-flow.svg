<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Consolas, monospace">
  <rect width="920" height="340" fill="#fafafa" rx="4"/>

  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">馈线自动化恢复流程——故障定位、隔离、恢复供电</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Original feeder -->
  <rect x="28" y="58" width="864" height="90" fill="white" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
  <text x="58" y="82" font-size="11" fill="#1a1a1a" font-weight="bold">正常运行</text>
  <line x1="110" y1="103" x2="810" y2="103" stroke="#6b7280" stroke-width="2"/>
  <rect x="132" y="90" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="146" y="104" font-size="8" fill="#1a1a1a" text-anchor="middle">S1</text>
  <rect x="258" y="90" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="272" y="104" font-size="8" fill="#1a1a1a" text-anchor="middle">S2</text>
  <rect x="382" y="90" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="396" y="104" font-size="8" fill="#1a1a1a" text-anchor="middle">S3</text>
  <rect x="506" y="90" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="520" y="104" font-size="8" fill="#1a1a1a" text-anchor="middle">S4</text>
  <rect x="630" y="90" width="28" height="20" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="644" y="104" font-size="8" fill="#f59e0b" text-anchor="middle">联络</text>
  <circle cx="718" cy="103" r="8" fill="#16a34a"/>
  <text x="718" y="106" font-size="7.5" fill="white" text-anchor="middle">L</text>
  <text x="708" y="128" font-size="8.5" fill="#666" text-anchor="middle">负荷区</text>

  <!-- Faulted state -->
  <rect x="28" y="154" width="864" height="76" fill="white" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
  <text x="58" y="177" font-size="11" fill="#dc2626" font-weight="bold">故障后</text>
  <line x1="110" y1="198" x2="810" y2="198" stroke="#6b7280" stroke-width="2"/>
  <rect x="258" y="185" width="28" height="20" fill="none" stroke="#dc2626" stroke-width="1.4" rx="2"/>
  <text x="272" y="199" font-size="8" fill="#dc2626" text-anchor="middle">故障</text>
  <line x1="286" y1="198" x2="340" y2="198" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrowRed)"/>
  <text x="314" y="186" font-size="8.5" fill="#dc2626" text-anchor="middle">故障电流</text>
  <text x="386" y="218" font-size="8.5" fill="#666" text-anchor="middle">保护跳闸后下游失电</text>
  <rect x="630" y="185" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="644" y="199" font-size="8" fill="#1a1a1a" text-anchor="middle">联络</text>
  <text x="718" y="218" font-size="8.5" fill="#666" text-anchor="middle">等待恢复</text>

  <!-- Restoration -->
  <rect x="28" y="244" width="864" height="72" fill="white" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
  <text x="58" y="268" font-size="11" fill="#16a34a" font-weight="bold">恢复供电</text>
  <line x1="110" y1="290" x2="810" y2="290" stroke="#6b7280" stroke-width="2"/>
  <rect x="132" y="277" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="146" y="291" font-size="8" fill="#1a1a1a" text-anchor="middle">S1</text>
  <rect x="258" y="277" width="28" height="20" fill="none" stroke="#dc2626" stroke-width="1.4" rx="2"/>
  <text x="272" y="291" font-size="8" fill="#dc2626" text-anchor="middle">故障段</text>
  <rect x="506" y="277" width="28" height="20" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="520" y="291" font-size="8" fill="#1a1a1a" text-anchor="middle">S4</text>
  <rect x="630" y="277" width="28" height="20" fill="none" stroke="#16a34a" stroke-width="1.4" rx="2"/>
  <text x="644" y="291" font-size="8" fill="#16a34a" text-anchor="middle">联络</text>
  <line x1="658" y1="287" x2="718" y2="287" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="700" y="276" font-size="8.5" fill="#16a34a" text-anchor="middle">非故障段恢复供电</text>
  <text x="386" y="312" font-size="8.5" fill="#666" text-anchor="middle">先隔离故障段，再校核转供容量，最后恢复非故障负荷</text>
</svg>
