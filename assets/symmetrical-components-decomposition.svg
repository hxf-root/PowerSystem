<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Consolas, monospace">
  <rect width="780" height="420" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">对称分量分解——不平衡三相 → 正序 + 负序 + 零序</text>

  <!-- ====== Step 1: Unbalanced input ====== -->
  <text x="140" y="56" font-size="11" font-weight="bold" fill="#555">输入：不对称三相相量</text>

  <!-- Complex plane circle 1 -->
  <circle cx="140" cy="140" r="55" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="85" y1="140" x2="195" y2="140" stroke="#eee" stroke-width="0.5"/>
  <line x1="140" y1="85" x2="140" y2="195" stroke="#eee" stroke-width="0.5"/>

  <!-- Ia vector (large, 0°) -->
  <line x1="140" y1="140" x2="140" y2="65" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="120" y="60" font-size="11" fill="#2563eb" font-weight="bold">Ia 120A</text>

  <!-- Ib vector (smaller, -130°) -->
  <line x1="140" y1="140" x2="92" y2="182" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="65" y="192" font-size="11" fill="#16a34a" font-weight="bold">Ib 70A</text>

  <!-- Ic vector (medium, -240° = +120°) -->
  <line x1="140" y1="140" x2="172" y2="98" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="178" y="95" font-size="11" fill="#dc2626" font-weight="bold">Ic 100A</text>

  <!-- Origin label -->
  <text x="145" y="155" font-size="9" fill="#999">O</text>

  <!-- Inequality note -->
  <text x="140" y="218" font-size="9" fill="#dc2626" text-anchor="middle">幅值不等、角度非 120° → 不对称</text>

  <!-- Big equals sign -->
  <text x="230" y="150" font-size="28" fill="#555" font-weight="bold" text-anchor="middle">=</text>

  <!-- ====== Step 2: Positive sequence ====== -->
  <rect x="270" y="52" width="160" height="170" fill="white" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="350" y="70" font-size="11" fill="#2563eb" font-weight="bold" text-anchor="middle">正序 I₁</text>

  <circle cx="350" cy="135" r="38" fill="none" stroke="#ddd" stroke-width="0.8"/>
  <line x1="312" y1="135" x2="388" y2="135" stroke="#eee" stroke-width="0.5"/>
  <line x1="350" y1="97" x2="350" y2="173" stroke="#eee" stroke-width="0.5"/>

  <line x1="350" y1="135" x2="350" y2="97" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="335" y="92" font-size="9" fill="#2563eb">A₁</text>

  <line x1="350" y1="135" x2="317" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="300" y="162" font-size="9" fill="#2563eb">B₁</text>

  <line x1="350" y1="135" x2="383" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="386" y="162" font-size="9" fill="#2563eb">C₁</text>

  <text x="350" y="210" font-size="9" fill="#2563eb" text-anchor="middle">三相对称 120° A→B→C</text>

  <!-- Plus sign -->
  <text x="443" y="150" font-size="24" fill="#555" text-anchor="middle">+</text>

  <!-- ====== Step 3: Negative sequence ====== -->
  <rect x="460" y="52" width="160" height="170" fill="white" stroke="#ea580c" stroke-width="1.5" rx="4"/>
  <text x="540" y="70" font-size="11" fill="#ea580c" font-weight="bold" text-anchor="middle">负序 I₂</text>

  <circle cx="540" cy="135" r="30" fill="none" stroke="#ddd" stroke-width="0.8"/>
  <line x1="510" y1="135" x2="570" y2="135" stroke="#eee" stroke-width="0.5"/>
  <line x1="540" y1="105" x2="540" y2="165" stroke="#eee" stroke-width="0.5"/>

  <line x1="540" y1="135" x2="540" y2="105" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="525" y="100" font-size="9" fill="#ea580c">A₂</text>

  <line x1="540" y1="135" x2="566" y2="150" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="572" y="156" font-size="9" fill="#ea580c">B₂</text>

  <line x1="540" y1="135" x2="514" y2="150" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="500" y="162" font-size="9" fill="#ea580c">C₂</text>

  <text x="540" y="210" font-size="9" fill="#ea580c" text-anchor="middle">三相对称 120° A→C→B（反）</text>

  <!-- Plus sign -->
  <text x="633" y="150" font-size="24" fill="#555" text-anchor="middle">+</text>

  <!-- ====== Step 4: Zero sequence ====== -->
  <rect x="650" y="52" width="110" height="170" fill="white" stroke="#8b5cf6" stroke-width="1.5" rx="4"/>
  <text x="705" y="70" font-size="11" fill="#8b5cf6" font-weight="bold" text-anchor="middle">零序 I₀</text>

  <circle cx="705" cy="135" r="25" fill="none" stroke="#ddd" stroke-width="0.8"/>
  <line x1="680" y1="135" x2="730" y2="135" stroke="#eee" stroke-width="0.5"/>

  <line x1="705" y1="135" x2="705" y2="110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="690" y="105" font-size="9" fill="#8b5cf6">A₀=B₀=C₀</text>

  <text x="705" y="210" font-size="9" fill="#8b5cf6" text-anchor="middle">三相完全同相位</text>

  <!-- ====== Bottom: Fault type table ====== -->
  <rect x="40" y="248" width="700" height="125" fill="white" stroke="#ddd" rx="4"/>

  <text x="390" y="272" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">各分量出现的物理条件</text>

  <!-- Table header -->
  <line x1="40" y1="280" x2="740" y2="280" stroke="#ddd" stroke-width="1"/>
  <text x="160" y="296" font-size="10" fill="#888" text-anchor="middle">故障类型</text>
  <text x="335" y="296" font-size="10" fill="#888" text-anchor="middle">正序 I₁</text>
  <text x="490" y="296" font-size="10" fill="#888" text-anchor="middle">负序 I₂</text>
  <text x="645" y="296" font-size="10" fill="#888" text-anchor="middle">零序 I₀</text>

  <!-- Rows -->
  <text x="160" y="316" font-size="10" fill="#333" text-anchor="middle">正常三相对称</text>
  <text x="335" y="316" font-size="14" fill="#2563eb" text-anchor="middle">✓</text>
  <text x="490" y="316" font-size="14" fill="#999" text-anchor="middle">—</text>
  <text x="645" y="316" font-size="14" fill="#999" text-anchor="middle">—</text>

  <text x="160" y="336" font-size="10" fill="#333" text-anchor="middle">相间短路（无接地）</text>
  <text x="335" y="336" font-size="14" fill="#2563eb" text-anchor="middle">✓</text>
  <text x="490" y="336" font-size="14" fill="#ea580c" text-anchor="middle">✓</text>
  <text x="645" y="336" font-size="14" fill="#999" text-anchor="middle">—</text>

  <text x="160" y="358" font-size="10" fill="#333" text-anchor="middle">单相接地 / 两相接地</text>
  <text x="335" y="358" font-size="14" fill="#2563eb" text-anchor="middle">✓</text>
  <text x="490" y="358" font-size="14" fill="#ea580c" text-anchor="middle">✓</text>
  <text x="645" y="358" font-size="14" fill="#8b5cf6" text-anchor="middle">✓</text>

  <!-- Separator -->
  <line x1="270" y1="290" x2="270" y2="366" stroke="#eee" stroke-width="0.5"/>
  <line x1="430" y1="290" x2="430" y2="366" stroke="#eee" stroke-width="0.5"/>
  <line x1="570" y1="290" x2="570" y2="366" stroke="#eee" stroke-width="0.5"/>

  <!-- Bottom note -->
  <text x="390" y="390" font-size="9" fill="#666" text-anchor="middle">负序 = 不对称的指纹 &nbsp;&nbsp;|&nbsp;&nbsp; 零序 = 接地的信号</text>

  <!-- Markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowOrange" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
