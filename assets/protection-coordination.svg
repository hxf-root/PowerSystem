<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Consolas, monospace">
  <rect width="900" height="330" fill="#fafafa" rx="4"/>

  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">保护配合示意——下级先动，上级后备</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="84" y1="252" x2="520" y2="252" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="84" y1="252" x2="84" y2="70" stroke="#6b7280" stroke-width="1.2"/>
  <text x="526" y="256" font-size="8.5" fill="#666">I</text>
  <text x="70" y="74" font-size="8.5" fill="#666">t</text>

  <text x="302" y="290" font-size="9" fill="#666" text-anchor="middle">电流越大，动作时间越短</text>

  <!-- Downstream relay curve -->
  <path d="M 120 220 C 146 208, 170 188, 192 168 S 234 126, 254 108 S 300 82, 340 78" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="332" y="70" font-size="9" fill="#2563eb">下级保护</text>
  <line x1="340" y1="78" x2="376" y2="78" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <!-- Upstream relay curve -->
  <path d="M 120 198 C 150 184, 180 164, 204 142 S 250 104, 286 92 S 348 74, 410 72" fill="none" stroke="#ea580c" stroke-width="2.2"/>
  <text x="398" y="64" font-size="9" fill="#ea580c">上级保护</text>
  <line x1="410" y1="72" x2="446" y2="72" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arrowOrange)"/>

  <!-- Instantaneous stage -->
  <path d="M 440 220 L 520 220" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="484" y="214" font-size="9" fill="#dc2626" text-anchor="middle">速断段</text>

  <!-- Fault/current regions -->
  <rect x="570" y="58" width="280" height="216" fill="white" stroke="#e5e7eb" stroke-width="1.2" rx="6"/>
  <text x="710" y="82" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">配合规则</text>

  <rect x="592" y="98" width="236" height="34" fill="#eff6ff" rx="4"/>
  <text x="710" y="120" font-size="10" fill="#2563eb" text-anchor="middle">故障越近，下级越先动作</text>

  <rect x="592" y="142" width="236" height="34" fill="#fff7ed" rx="4"/>
  <text x="710" y="164" font-size="10" fill="#ea580c" text-anchor="middle">下级拒动，上级作为后备兜底</text>

  <rect x="592" y="186" width="236" height="34" fill="#fef2f2" rx="4"/>
  <text x="710" y="208" font-size="10" fill="#dc2626" text-anchor="middle">时间级差要留足，避免误跳</text>

  <text x="710" y="250" font-size="8.5" fill="#666" text-anchor="middle">配合的本质是“谁先切故障段”</text>

  <!-- Callout at bottom -->
  <rect x="34" y="284" width="816" height="24" fill="white" stroke="#e5e7eb" rx="5"/>
  <text x="442" y="300" font-size="9" fill="#666" text-anchor="middle">反时限曲线的作用：小故障留时间，大故障快切除，方便上下级保护协调。</text>
</svg>
