<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Consolas, monospace">
  <rect width="820" height="420" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">配电网三种拓扑结构</text>

  <!-- ====== Topology 1: Radial ====== -->
  <rect x="14" y="38" width="252" height="310" fill="white" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="140" y="60" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">辐射型</text>

  <!-- Substation bus -->
  <rect x="110" y="72" width="60" height="16" fill="#2563eb" rx="2"/>
  <text x="140" y="84" font-size="8" fill="white" text-anchor="middle">变电站母线</text>

  <!-- Line down -->
  <line x1="140" y1="88" x2="140" y2="100" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Distribution line (horizontal) -->
  <line x1="60" y1="100" x2="220" y2="100" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Feeders -->
  <g>
    <!-- Feeder A -->
    <line x1="80" y1="100" x2="80" y2="140" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="68" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="80" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">CB</text>

    <rect x="68" y="142" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="80" y="151" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S1</text>
    <line x1="80" y1="140" x2="80" y2="142" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="80" y1="154" x2="80" y2="180" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="68" y="182" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="80" y="191" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S2</text>
    <line x1="80" y1="180" x2="80" y2="182" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="80" y1="194" x2="80" y2="215" stroke="#6b7280" stroke-width="1.3"/>
    <circle cx="80" cy="220" r="6" fill="#16a34a"/>
    <text x="80" y="223" font-size="7.5" fill="white" text-anchor="middle">L</text>

    <!-- Feeder B -->
    <line x1="140" y1="100" x2="140" y2="140" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="128" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="140" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">CB</text>

    <rect x="128" y="142" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="140" y="151" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S3</text>
    <line x1="140" y1="140" x2="140" y2="142" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="140" y1="154" x2="140" y2="180" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="128" y="182" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="140" y="191" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S4</text>
    <line x1="140" y1="180" x2="140" y2="182" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="140" y1="194" x2="140" y2="215" stroke="#6b7280" stroke-width="1.3"/>
    <circle cx="140" cy="220" r="6" fill="#16a34a"/>
    <text x="140" y="223" font-size="7.5" fill="white" text-anchor="middle">L</text>

    <!-- Feeder C -->
    <line x1="200" y1="100" x2="200" y2="140" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="188" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="200" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">CB</text>

    <rect x="188" y="142" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="200" y="151" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S5</text>
    <line x1="200" y1="140" x2="200" y2="142" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="200" y1="154" x2="200" y2="180" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="188" y="182" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <text x="200" y="191" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S6</text>
    <line x1="200" y1="180" x2="200" y2="182" stroke="#6b7280" stroke-width="1.3"/>

    <line x1="200" y1="194" x2="200" y2="215" stroke="#6b7280" stroke-width="1.3"/>
    <circle cx="200" cy="220" r="6" fill="#16a34a"/>
    <text x="200" y="223" font-size="7.5" fill="white" text-anchor="middle">L</text>
  </g>

  <!-- Fault indicator -->
  <g transform="translate(78, 248)">
    <rect x="0" y="0" width="118" height="16" fill="#fef2f2" rx="2"/>
    <text x="59" y="12" font-size="8" fill="#dc2626" text-anchor="middle">任一故障 → 下游全停</text>
  </g>

  <!-- Key traits -->
  <text x="30" y="290" font-size="9" fill="#666">✓ 结构简单，保护容易整定</text>
  <text x="30" y="306" font-size="9" fill="#666">✗ 无冗余，N-1 必停电</text>
  <text x="30" y="322" font-size="9" fill="#666">适用：农村、偏远地区</text>

  <!-- ====== Topology 2: Ring / Open-loop ====== -->
  <rect x="276" y="38" width="252" height="310" fill="white" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="402" y="60" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">环网（开环运行）</text>

  <!-- Two substation buses -->
  <rect x="304" y="72" width="50" height="14" fill="#2563eb" rx="2"/>
  <text x="329" y="83" font-size="7.5" fill="white" text-anchor="middle">变电站A</text>
  <rect x="450" y="72" width="50" height="14" fill="#2563eb" rx="2"/>
  <text x="475" y="83" font-size="7.5" fill="white" text-anchor="middle">变电站B</text>

  <!-- Lines from substations -->
  <line x1="329" y1="86" x2="329" y2="100" stroke="#6b7280" stroke-width="1.3"/>
  <line x1="475" y1="86" x2="475" y2="100" stroke="#6b7280" stroke-width="1.3"/>

  <!-- Horizontal trunk lines -->
  <line x1="329" y1="100" x2="475" y2="100" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Switches along trunk -->
  <!-- Left side -->
  <rect x="317" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="329" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S1</text>

  <rect x="353" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="365" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S2</text>

  <!-- Middle: normally-open tie switch -->
  <rect x="389" y="102" width="28" height="20" fill="none" stroke="#f59e0b" stroke-width="1.8" rx="3"/>
  <text x="403" y="114" font-size="7.5" fill="#f59e0b" text-anchor="middle">联络</text>
  <text x="403" y="124" font-size="7" fill="#f59e0b" text-anchor="middle">（常开）</text>
  <!-- Open gap -->
  <line x1="389" y1="100" x2="417" y2="100" stroke="#fafafa" stroke-width="3"/>

  <!-- Right side -->
  <rect x="425" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="437" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S3</text>

  <rect x="461" y="102" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="473" y="111" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S4</text>

  <!-- Down to loads -->
  <!-- Load from S1 -->
  <line x1="329" y1="114" x2="329" y2="150" stroke="#6b7280" stroke-width="1.3"/>
  <rect x="317" y="152" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="329" y="161" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S5</text>
  <line x1="329" y1="164" x2="329" y2="182" stroke="#6b7280" stroke-width="1.3"/>
  <circle cx="329" cy="188" r="6" fill="#16a34a"/>
  <text x="329" y="191" font-size="7.5" fill="white" text-anchor="middle">L</text>

  <!-- Load from S2 -->
  <line x1="365" y1="114" x2="365" y2="150" stroke="#6b7280" stroke-width="1.3"/>
  <rect x="353" y="152" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="365" y="161" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S6</text>
  <line x1="365" y1="164" x2="365" y2="182" stroke="#6b7280" stroke-width="1.3"/>
  <circle cx="365" cy="188" r="6" fill="#16a34a"/>
  <text x="365" y="191" font-size="7.5" fill="white" text-anchor="middle">L</text>

  <!-- Load from S3 -->
  <line x1="437" y1="114" x2="437" y2="150" stroke="#6b7280" stroke-width="1.3"/>
  <rect x="425" y="152" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="437" y="161" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S7</text>
  <line x1="437" y1="164" x2="437" y2="182" stroke="#6b7280" stroke-width="1.3"/>
  <circle cx="437" cy="188" r="6" fill="#16a34a"/>
  <text x="437" y="191" font-size="7.5" fill="white" text-anchor="middle">L</text>

  <!-- Load from S4 -->
  <line x1="473" y1="114" x2="473" y2="150" stroke="#6b7280" stroke-width="1.3"/>
  <rect x="461" y="152" width="24" height="12" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <text x="473" y="161" font-size="7.5" fill="#1a1a1a" text-anchor="middle">S8</text>
  <line x1="473" y1="164" x2="473" y2="182" stroke="#6b7280" stroke-width="1.3"/>
  <circle cx="473" cy="188" r="6" fill="#16a34a"/>
  <text x="473" y="191" font-size="7.5" fill="white" text-anchor="middle">L</text>

  <!-- Fault scenario annotation -->
  <g transform="translate(290, 212)">
    <rect x="0" y="0" width="222" height="36" fill="#eff6ff" rx="3"/>
    <text x="111" y="13" font-size="8" fill="#2563eb" text-anchor="middle">故障恢复：断开故障段 → 合联络</text>
    <text x="111" y="27" font-size="8" fill="#2563eb" text-anchor="middle">→ 非故障段恢复供电（几分钟）</text>
  </g>

  <!-- Key traits -->
  <text x="290" y="270" font-size="9" fill="#666">✓ N-1 安全，故障可恢复</text>
  <text x="290" y="286" font-size="9" fill="#666">✗ 联络容量需预留（馈线负载&lt;50%）</text>
  <text x="290" y="302" font-size="9" fill="#666">✓ 保护简单（开环 = 等效辐射）</text>
  <text x="290" y="318" font-size="9" fill="#666">适用：城市配网、对可靠性要求高</text>

  <!-- ====== Topology 3: Multi-tie ====== -->
  <rect x="538" y="38" width="268" height="310" fill="white" stroke="#16a34a" stroke-width="1.5" rx="4"/>
  <text x="672" y="60" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="middle">多联络（高可靠性）</text>

  <!-- Four feeders from one bus -->
  <rect x="642" y="72" width="60" height="14" fill="#2563eb" rx="2"/>
  <text x="672" y="83" font-size="7.5" fill="white" text-anchor="middle">变电站母线</text>
  <line x1="650" y1="86" x2="650" y2="98" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="664" y1="86" x2="664" y2="98" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="680" y1="86" x2="680" y2="98" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="694" y1="86" x2="694" y2="98" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Horizontal trunk lines (4 feeders) -->
  <line x1="554" y1="100" x2="740" y2="100" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="554" y1="130" x2="740" y2="130" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="554" y1="160" x2="740" y2="160" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="554" y1="190" x2="740" y2="190" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Switches on each feeder -->
  <g font-size="7" fill="#1a1a1a" text-anchor="middle">
    <!-- Feeder 1 -->
    <rect x="556" y="92" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="564" y="99">S</text>
    <rect x="600" y="92" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="608" y="99">S</text>
    <!-- Feeder 2 -->
    <rect x="556" y="122" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="564" y="129">S</text>
    <rect x="600" y="122" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="608" y="129">S</text>
    <!-- Feeder 3 -->
    <rect x="556" y="152" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="564" y="159">S</text>
    <rect x="600" y="152" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="608" y="159">S</text>
    <!-- Feeder 4 -->
    <rect x="556" y="182" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="564" y="189">S</text>
    <rect x="600" y="182" width="16" height="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" rx="1"/><text x="608" y="189">S</text>
  </g>

  <!-- Tie switches between feeders (normally open) -->
  <!-- T1: between feeder 1 and 2 -->
  <rect x="625" y="108" width="22" height="14" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="636" y="118" font-size="6.5" fill="#f59e0b" text-anchor="middle">联络</text>

  <!-- T2: between feeder 2 and 3 -->
  <rect x="625" y="138" width="22" height="14" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="636" y="148" font-size="6.5" fill="#f59e0b" text-anchor="middle">联络</text>

  <!-- T3: between feeder 3 and 4 -->
  <rect x="625" y="168" width="22" height="14" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
  <text x="636" y="178" font-size="6.5" fill="#f59e0b" text-anchor="middle">联络</text>

  <!-- Loads at end -->
  <g font-size="6.5" fill="white" text-anchor="middle">
    <circle cx="650" cy="100" r="5" fill="#16a34a"/><text x="650" y="103">L1</text>
    <circle cx="718" cy="100" r="5" fill="#16a34a"/><text x="718" y="103">L2</text>
    <circle cx="650" cy="130" r="5" fill="#16a34a"/><text x="650" y="133">L3</text>
    <circle cx="718" cy="130" r="5" fill="#16a34a"/><text x="718" y="133">L4</text>
    <circle cx="650" cy="160" r="5" fill="#16a34a"/><text x="650" y="163">L5</text>
    <circle cx="718" cy="160" r="5" fill="#16a34a"/><text x="718" y="163">L6</text>
    <circle cx="650" cy="190" r="5" fill="#16a34a"/><text x="650" y="193">L7</text>
    <circle cx="718" cy="190" r="5" fill="#16a34a"/><text x="718" y="193">L8</text>
  </g>

  <!-- Note line -->
  <g transform="translate(554, 212)">
    <rect x="0" y="0" width="238" height="36" fill="#f0fdf4" rx="3"/>
    <text x="119" y="13" font-size="8" fill="#16a34a" text-anchor="middle">每条馈线通过联络可互为备用</text>
    <text x="119" y="27" font-size="8" fill="#16a34a" text-anchor="middle">馈线负载率需 &lt; 50%（N-1 容量约束）</text>
  </g>

  <!-- Key traits -->
  <text x="554" y="270" font-size="9" fill="#666">✓ 供电可靠性最高</text>
  <text x="554" y="286" font-size="9" fill="#666">✗ 投资大、接线复杂、保护配合难</text>
  <text x="554" y="302" font-size="9" fill="#666">✓ 适合重点用户、核心城区</text>
  <text x="554" y="318" font-size="9" fill="#666">FTU：每个开关都需 FTU 监控</text>

  <!-- ====== Bottom: Comparison row ====== -->
  <rect x="14" y="358" width="792" height="52" fill="white" stroke="#e5e7eb" stroke-width="1" rx="4"/>

  <text x="26" y="378" font-size="10" fill="#1a1a1a" font-weight="bold">核心原则</text>

  <g font-size="9" fill="#666">
    <text x="26" y="396">配网：闭环设计、开环运行</text>
    <text x="280" y="396">开环 = 潮流可控 = 保护简单</text>
    <text x="530" y="396">联络 = 故障时的救生通道</text>
  </g>
</svg>
