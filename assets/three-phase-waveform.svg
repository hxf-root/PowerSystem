  <text x="480" y="244" font-size="9" fill="#999">T = 20ms</text>

  <line x1="615" y1="141" x2="615" y2="230" stroke="#ddd" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="590" y="244" font-size="9" fill="#999">25ms</text>

