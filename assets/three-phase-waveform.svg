  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="750" height="320" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">三相电压波形（时域）——正序 A→B→C</text>
  <text x="18" y="42" font-size="10" fill="#888">50Hz，周期 20ms，各相差 6.67ms = 120°</text>

  <!-- Waveform area -->
  <rect x="40" y="56" width="690" height="170" fill="white" stroke="#ddd" rx="2"/>

  <!-- Horizontal axis (time) -->
  <line x1="40" y1="141" x2="730" y2="141" stroke="#999" stroke-width="1"/>
  <text x="735" y="145" font-size="10" fill="#999">t</text>

  <!-- Time markers -->
  <line x1="40" y1="141" x2="40" y2="230" stroke="#ddd" stroke-width="0.5" stroke-dasharray="3,3"/>
