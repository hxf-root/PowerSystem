  <!-- Peak markers: A peak at 5ms (x=156), B peak at 11.67ms (x=308) -->
  <line x1="156" y1="71" x2="156" y2="215" stroke="#2563eb" stroke-width="0.7" stroke-dasharray="2,3"/>
  <line x1="308" y1="71" x2="308" y2="215" stroke="#16a34a" stroke-width="0.7" stroke-dasharray="2,3"/>

  <!-- Arrow showing 120° from A peak to B peak -->
  <line x1="156" y1="212" x2="308" y2="212" stroke="#555" stroke-width="1" marker-end="url(#arrowH)"/>
  <text x="232" y="207" font-size="10" fill="#555" text-anchor="middle">120° (6.67ms)</text>

  <!-- Legend -->
  <rect x="40" y="255" width="690" height="28" fill="white" stroke="#ddd" rx="2"/>
  <line x1="60" y1="269" x2="90" y2="269" stroke="#2563eb" stroke-width="2.2"/>
  <text x="98" y="273" font-size="11" fill="#2563eb" font-weight="bold">A 相</text>

  <line x1="160" y1="269" x2="190" y2="269" stroke="#16a34a" stroke-width="2.2"/>
  <text x="198" y="273" font-size="11" fill="#16a34a" font-weight="bold">B 相（滞后 A 120°）</text>

  <line x1="360" y1="269" x2="390" y2="269" stroke="#dc2626" stroke-width="2.2"/>
  <text x="398" y="273" font-size="11" fill="#dc2626" font-weight="bold">C 相（滞后 B 120°）</text>

  <!-- Bottom note -->
  <text x="375" y="302" font-size="10" fill="#666" text-anchor="middle">任意时刻，ua + ub + uc = 0（三相对称时的恒等式）</text>

  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
</svg>
