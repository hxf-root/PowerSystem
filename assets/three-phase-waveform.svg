  <path d="M 40,80.4 L 44,82.4 L 48,84.6 L 52,86.9 L 56,89.4 L 60,92.1 L 64,94.9 L 68,97.8 L 72,100.9 L 76,104.1 L 80,107.4 L 84,110.8 L 88,114.3 L 92,117.9 L 96,121.5 L 100,125.2 L 104,128.9 L 108,132.7 L 112,136.5 L 116,140.4 L 120,144.2 L 124,148.0 L 128,151.8 L 132,155.6 L 136,159.3 L 140,162.9 L 144,166.5 L 148,170.1 L 152,173.5 L 156,176.8 L 160,180.1 L 164,183.2 L 168,186.2 L 172,189.0 L 176,191.7 L 180,194.3 L 184,196.7 L 188,198.9 L 192,201.0 L 196,202.9 L 200,204.6 L 204,206.1 L 208,207.4 L 212,208.5 L 216,209.4 L 220,210.1 L 224,210.6 L 228,210.9 L 232,211.0 L 236,210.9 L 240,210.5 L 244,210.0 L 248,209.3 L 252,208.3 L 256,207.2 L 260,205.8 L 264,204.3 L 268,202.6 L 272,200.6 L 276,198.6 L 280,196.3 L 284,193.9 L 288,191.3 L 292,188.5 L 296,185.7 L 300,182.7 L 304,179.5 L 308,176.3 L 312,172.9 L 316,169.5 L 320,165.9 L 324,162.3 L 328,158.7 L 332,154.9 L 336,151.2 L 340,147.4 L 344,143.5 L 348,139.7 L 352,135.9 L 356,132.1 L 360,128.3 L 364,124.6 L 368,120.9 L 372,117.3 L 376,113.7 L 380,110.2 L 384,106.8 L 388,103.5 L 392,100.4 L 396,97.3 L 400,94.4 L 404,91.6 L 408,89.0 L 412,86.5 L 416,84.2 L 420,82.0 L 424,80.1 L 428,78.3 L 432,76.7 L 436,75.3 L 440,74.0 L 444,73.0 L 448,72.2 L 452,71.6 L 456,71.2 L 460,71.0 L 464,71.0 L 468,71.3 L 472,71.7 L 476,72.3 L 480,73.2 L 484,74.2 L 488,75.5 L 492,76.9 L 496,78.6 L 500,80.4 L 504,82.4 L 508,84.6 L 512,86.9 L 516,89.4 L 520,92.1 L 524,94.9 L 528,97.8 L 532,100.9 L 536,104.1 L 540,107.4 L 544,110.8 L 548,114.3 L 552,117.9 L 556,121.5 L 560,125.2 L 564,128.9 L 568,132.7 L 572,136.5 L 576,140.4 L 580,144.2 L 584,148.0 L 588,151.8 L 592,155.6 L 596,159.3 L 600,162.9 L 604,166.5 L 608,170.1 L 612,173.5 L 616,176.8 L 620,180.1 L 624,183.2 L 628,186.2 L 632,189.0 L 636,191.7 L 640,194.3 L 644,196.7 L 648,198.9 L 652,201.0 L 656,202.9 L 660,204.6 L 664,206.1 L 668,207.4 L 672,208.5 L 676,209.4 L 680,210.1 L 684,210.6 L 688,210.9 L 692,211.0 L 696,210.9 L 700,210.5 L 704,210.0 L 708,209.3 L 712,208.3 L 716,207.2 L 720,