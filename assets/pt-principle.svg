<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Consolas, monospace">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDownRed" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="700" height="260" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">PT（电压互感器）原理</text>

  <!-- ====== Iron core (two vertical legs + horizontal yokes) ====== -->
  <!-- Top yoke -->
  <rect x="270" y="60" width="120" height="18" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <!-- Bottom yoke -->
  <rect x="270" y="172" width="120" height="18" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <!-- Left leg -->
  <rect x="270" y="78" width="28" height="94" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <!-- Right leg -->
  <rect x="362" y="78" width="28" height="94" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>

  <!-- Core label -->
  <text x="330" y="110" font-size="10" fill="#8b5cf6" text-anchor="middle">铁</text>
  <text x="330" y="123" font-size="10" fill="#8b5cf6" text-anchor="middle">芯</text>

  <!-- ====== Primary winding (left leg, many turns = more loops) ====== -->
  <!-- Primary coil symbol: series of arcs wrapping the left leg (x≈284) -->
  <g fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round">
    <!-- Winding on left leg - arcs going left from the leg -->
    <path d="M 270 82  Q 255 82,  255 88  L 255 94   Q 255 100, 270 100"/>
    <path d="M 270 100 Q 255 100, 255 106 L 255 112  Q 255 118, 270 118"/>
    <path d="M 270 118 Q 255 118, 255 124 L 255 130  Q 255 136, 270 136"/>
    <path d="M 270 136 Q 255 136, 255 142 L 255 148  Q 255 154, 270 154"/>
    <path d="M 270 154 Q 255 154, 255 160 L 255 166  Q 255 172, 270 172"/>
  </g>

  <!-- Primary leads (from top/bottom of winding, going left) -->
  <line x1="255" y1="82" x2="215" y2="82" stroke="#2563eb" stroke-width="1.8"/>
  <!-- Dotted node at terminal -->
  <circle cx="215" cy="82" r="4" fill="#2563eb"/>
  <text x="198" y="78" font-size="10" fill="#2563eb" font-weight="bold">A</text>
  <text x="130" y="78" font-size="10" fill="#666">（高压侧）</text>

  <line x1="255" y1="172" x2="215" y2="172" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="215" cy="172" r="4" fill="#2563eb"/>
  <text x="198" y="176" font-size="10" fill="#2563eb" font-weight="bold">N</text>

  <!-- Primary label -->
  <text x="240" y="132" font-size="10" fill="#2563eb" font-weight="bold" text-anchor="end">N₁ 匝</text>

  <!-- ====== Secondary winding (right leg, fewer turns = fewer loops) ====== -->
  <g fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round">
    <path d="M 390 90  Q 405 90,  405 97  L 405 105  Q 405 112, 390 112"/>
    <path d="M 390 112 Q 405 112, 405 120 L 405 128  Q 405 135, 390 135"/>
    <path d="M 390 135 Q 405 135, 405 143 L 405 151  Q 405 158, 390 158"/>
  </g>

  <!-- Secondary leads -->
  <line x1="405" y1="90" x2="460" y2="90" stroke="#dc2626" stroke-width="2"/>
  <circle cx="460" cy="90" r="4" fill="#dc2626"/>
  <text x="470" y="94" font-size="10" fill="#dc2626" font-weight="bold">a</text>
  <text x="485" y="94" font-size="10" fill="#666">（采样）</text>

  <line x1="405" y1="158" x2="460" y2="158" stroke="#dc2626" stroke-width="2"/>
  <circle cx="460" cy="158" r="4" fill="#dc2626"/>
  <text x="470" y="162" font-size="10" fill="#dc2626" font-weight="bold">n</text>

  <!-- Secondary label -->
  <text x="418" y="128" font-size="10" fill="#dc2626" font-weight="bold">N₂ 匝</text>

  <!-- ====== Voltage labels with arrows ====== -->
  <!-- Primary voltage -->
  <line x1="155" y1="82" x2="155" y2="172" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="132" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="end">U₁</text>
  <text x="50" y="132" font-size="10" fill="#999" text-anchor="end">10kV/√3</text>

  <!-- Secondary voltage -->
  <line x1="520" y1="90" x2="520" y2="158" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="535" y="128" font-size="12" fill="#dc2626" font-weight="bold">U₂</text>
  <text x="535" y="143" font-size="10" fill="#999">100V/√3</text>

  <!-- ====== Flux arrow through core ====== -->
  <text x="330" y="80" font-size="11" fill="#8b5cf6" text-anchor="middle">Φ</text>

  <!-- ====== Bottom formula bar ====== -->
  <rect x="120" y="220" width="420" height="26" rx="4" fill="white" stroke="#ccc"/>
  <text x="330" y="238" font-size="12" fill="#333" text-anchor="middle" font-family="Consolas, monospace">U₁ / U₂ = N₁ / N₂ = K（变压比）</text>
</svg>
