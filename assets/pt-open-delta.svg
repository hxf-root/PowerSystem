<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Consolas, monospace">
  <rect width="700" height="350" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">开口三角——零序电压检测</text>
  <text x="18" y="42" font-size="10" fill="#888">三台 PT 的第三绕组串联成开口，输出 3U₀</text>

  <!-- ====== Left: Normal condition ====== -->
  <text x="120" y="72" font-size="12" font-weight="bold" fill="#16a34a">正常（三相对称）</text>

  <!-- Phase A tertiary winding -->
  <g transform="translate(60, 85)">
    <path d="M 0 15 Q 12 8, 0 0 Q -12 8, 0 15 Q 12 22, 0 30 Q -12 38, 0 45 Q 12 52, 0 60" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="0" y2="75" stroke="#2563eb" stroke-width="1.5"/>
    <text x="25" y="6" font-size="11" fill="#2563eb" font-weight="bold">Ua₃</text>
    <text x="25" y="20" font-size="9" fill="#999">57.7V</text>
  </g>

  <!-- Phase B tertiary winding -->
  <g transform="translate(180, 85)">
    <path d="M 0 15 Q 12 8, 0 0 Q -12 8, 0 15 Q 12 22, 0 30 Q -12 38, 0 45 Q 12 52, 0 60" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="0" y2="75" stroke="#16a34a" stroke-width="1.5"/>
    <text x="25" y="6" font-size="11" fill="#16a34a" font-weight="bold">Ub₃</text>
    <text x="25" y="20" font-size="9" fill="#999">57.7V</text>
  </g>

  <!-- Phase C tertiary winding -->
  <g transform="translate(300, 85)">
    <path d="M 0 15 Q 12 8, 0 0 Q -12 8, 0 15 Q 12 22, 0 30 Q -12 38, 0 45 Q 12 52, 0 60" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="0" y2="75" stroke="#dc2626" stroke-width="1.5"/>
    <text x="25" y="6" font-size="11" fill="#dc2626" font-weight="bold">Uc₃</text>
    <text x="25" y="20" font-size="9" fill="#999">57.7V</text>
  </g>

  <!-- Series connections between windings -->
  <line x1="60" y1="160" x2="180" y2="160" stroke="#555" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="300" y2="160" stroke="#555" stroke-width="1.5"/>

  <!-- Output lines -->
  <line x1="60" y1="100" x2="60" y2="60" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="300" y1="171" x2="460" y2="171" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Meter -->
  <circle cx="400" cy="130" r="22" fill="white" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="125" font-size="10" fill="#333" text-anchor="middle">V</text>
  <text x="400" y="138" font-size="8" fill="#16a34a" text-anchor="middle">≈0</text>

  <line x1="460" y1="171" x2="460" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="60" y2="130" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="60" y1="130" x2="378" y2="130" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Normal explanation -->
  <text x="400" y="180" font-size="10" fill="#16a34a" text-anchor="middle">Ua₃ + Ub₃ + Uc₃ = 0</text>
  <text x="400" y="195" font-size="10" fill="#666" text-anchor="middle">三个向量互差 120°，和为零</text>

  <!-- ====== Right: Ground fault condition ====== -->
  <rect x="40" y="215" width="620" height="125" fill="#fef2f2" stroke="#fca5a5" rx="4"/>

  <text x="350" y="240" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">单相接地故障时</text>

  <!-- Simplified fault diagram -->
  <!-- A phase (grounded - voltage collapses) -->
  <g transform="translate(80, 255)">
    <path d="M 0 10 Q 10 4, 0 0 Q -10 4, 0 10 Q 10 16, 0 22" fill="none" stroke="#999" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="0" y2="0" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="22" x2="0" y2="32" stroke="#999" stroke-width="1"/>
    <text x="18" y="6" font-size="9" fill="#999">Ua₃↓</text>
  </g>

  <!-- B phase (healthy - voltage rises) -->
  <g transform="translate(190, 255)">
    <path d="M 0 10 Q 10 4, 0 0 Q -10 4, 0 10 Q 10 16, 0 22" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="1"/>
    <line x1="0" y1="22" x2="0" y2="32" stroke="#16a34a" stroke-width="1"/>
    <text x="18" y="6" font-size="9" fill="#16a34a">Ub₃↑</text>
  </g>

  <!-- C phase (healthy - voltage rises) -->
  <g transform="translate(300, 255)">
    <path d="M 0 10 Q 10 4, 0 0 Q -10 4, 0 10 Q 10 16, 0 22" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="1"/>
    <line x1="0" y1="22" x2="0" y2="32" stroke="#dc2626" stroke-width="1"/>
    <text x="18" y="6" font-size="9" fill="#dc2626">Uc₃↑</text>
  </g>

  <!-- Series connections -->
  <line x1="95" y1="287" x2="205" y2="287" stroke="#555" stroke-width="1"/>
  <line x1="205" y1="287" x2="315" y2="287" stroke="#555" stroke-width="1"/>

  <!-- Output to meter with 3U0 -->
  <line x1="80" y1="260" x2="80" y2="250" stroke="#999" stroke-width="1"/>
  <line x1="80" y1="250" x2="378" y2="250" stroke="#999" stroke-width="1"/>
  <line x1="315" y1="287" x2="460" y2="287" stroke="#dc2626" stroke-width="1"/>
  <line x1="460" y1="287" x2="460" y2="260" stroke="#dc2626" stroke-width="1"/>

  <!-- Meter showing voltage -->
  <circle cx="400" cy="255" r="22" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="250" font-size="10" fill="#333" text-anchor="middle">V</text>
  <text x="400" y="264" font-size="8" fill="#dc2626" text-anchor="middle">U_Δ ≠ 0</text>

  <!-- Result -->
  <text x="400" y="310" font-size="11" fill="#dc2626" font-weight="bold" text-anchor="middle">U_Δ = 3U₀ ≈ 100V</text>

  <!-- Arrow showing imbalance -->
  <text x="530" y="276" font-size="10" fill="#666">三相不再对称</text>
  <text x="530" y="292" font-size="10" fill="#666">→ 开口电压出现</text>
</svg>
