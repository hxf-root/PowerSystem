<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Consolas, monospace">
  <rect width="520" height="280" fill="#fafafa" rx="4"/>
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">V-V 接线（两台单相 PT）</text>
  <text x="18" y="42" font-size="10" fill="#888">只能测线电压 Uab、Ubc、Uca，无中性点参考</text>

  <!-- Phase A bus -->
  <line x1="40" y1="80" x2="460" y2="80" stroke="#2563eb" stroke-width="2.5"/>
  <text x="20" y="84" font-size="12" fill="#2563eb" font-weight="bold">A</text>

  <!-- Phase B bus -->
  <line x1="40" y1="160" x2="460" y2="160" stroke="#16a34a" stroke-width="2.5"/>
  <text x="20" y="164" font-size="12" fill="#16a34a" font-weight="bold">B</text>

  <!-- Phase C bus -->
  <line x1="40" y1="240" x2="460" y2="240" stroke="#dc2626" stroke-width="2.5"/>
  <text x="20" y="244" font-size="12" fill="#dc2626" font-weight="bold">C</text>

  <!-- PT1: between A and B -->
  <g transform="translate(120, 80)">
    <!-- Coil symbol (2 arcs) -->
    <path d="M 20 0 L 20 15 Q 35 22, 20 30 Q 5 38, 20 45 Q 35 52, 20 60 Q 5 68, 20 75 L 20 90" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- P1 dot -->
    <circle cx="20" cy="52" r="3" fill="#2563eb"/>
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="20" y2="90" stroke="#16a34a" stroke-width="1.5"/>
    <!-- Label -->
    <text x="40" y="48" font-size="11" fill="#333" font-weight="bold">PT1</text>
  </g>

  <!-- PT2: between B and C -->
  <g transform="translate(220, 160)">
    <path d="M 20 0 L 20 15 Q 35 22, 20 30 Q 5 38, 20 45 Q 35 52, 20 60 Q 5 68, 20 75 L 20 90" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="20" cy="52" r="3" fill="#16a34a"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="20" y2="90" stroke="#dc2626" stroke-width="1.5"/>
    <text x="40" y="48" font-size="11" fill="#333" font-weight="bold">PT2</text>
  </g>

  <!-- Secondary: a, b, c outputs on right -->
  <line x1="280" y1="125" x2="420" y2="125" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="129" font-size="11" fill="#2563eb" font-weight="bold">a</text>
  <circle cx="280" cy="125" r="3" fill="#2563eb"/>

  <line x1="340" y1="205" x2="420" y2="205" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="209" font-size="11" fill="#16a34a" font-weight="bold">b</text>
  <circle cx="340" cy="205" r="3" fill="#16a34a"/>

  <line x1="370" y1="240" x2="420" y2="240" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="244" font-size="11" fill="#dc2626" font-weight="bold">c</text>
  <circle cx="370" cy="240" r="3" fill="#dc2626"/>

  <!-- Annotations -->
  <text x="300" y="108" font-size="10" fill="#888">Uab</text>
  <text x="370" y="230" font-size="10" fill="#888">Ucb</text>

  <!-- Cost note -->
  <text x="40" y="272" font-size="10" fill="#666">特点：省一台 PT，成本低，10kV/35kV 配电线路常用</text>
</svg>
