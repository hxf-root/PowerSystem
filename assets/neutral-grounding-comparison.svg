<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Consolas, monospace">
  <rect width="800" height="380" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">三种中性点接地方式对比</text>

  <!-- ====== Method 1: Low resistance ====== -->
  <rect x="18" y="38" width="248" height="260" fill="white" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="142" y="60" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">小电阻接地</text>

  <!-- Transformer secondary Y -->
  <g transform="translate(95, 75)">
    <!-- Y windings -->
    <path d="M 0 15 Q 10 8, 0 0 Q -10 8, 0 15 Q 10 22, 0 30 Q -10 38, 0 45 Q 10 52, 0 60" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <path d="M 30 15 Q 40 8, 30 0 Q 20 8, 30 15 Q 40 22, 30 30 Q 20 38, 30 45 Q 40 52, 30 60" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 60 15 Q 70 8, 60 0 Q 50 8, 60 15 Q 70 22, 60 30 Q 50 38, 60 45 Q 70 52, 60 60" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <!-- Lines up -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#2563eb" stroke-width="1.2"/>
    <line x1="30" y1="0" x2="30" y2="-12" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="60" y1="0" x2="60" y2="-12" stroke="#dc2626" stroke-width="1.2"/>
    <!-- Neutral point -->
    <circle cx="30" cy="65" r="4" fill="#888"/>
    <line x1="30" y1="60" x2="30" y2="65" stroke="#888" stroke-width="1.2"/>
    <!-- Resistor from neutral to ground -->
    <rect x="22" y="75" width="16" height="30" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="42" y="95" font-size="9" fill="#dc2626">Rg</text>
    <!-- Ground -->
    <line x1="30" y1="105" x2="30" y2="115" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="20" y1="115" x2="40" y2="115" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="24" y1="120" x2="36" y2="120" stroke="#dc2626" stroke-width="1"/>
    <line x1="26" y1="125" x2="34" y2="125" stroke="#dc2626" stroke-width="0.7"/>

    <!-- Phase labels -->
    <text x="-8" y="-16" font-size="9" fill="#2563eb">A</text>
    <text x="22" y="-16" font-size="9" fill="#16a34a">B</text>
    <text x="52" y="-16" font-size="9" fill="#dc2626">C</text>
  </g>

  <!-- Ground fault indication -->
  <line x1="220" y1="105" x2="252" y2="105" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="60" y="210" font-size="10" fill="#dc2626">Rg = 6~20Ω</text>
  <text x="60" y="226" font-size="10" fill="#dc2626">接地电流：200~1000A</text>
  <text x="60" y="242" font-size="10" fill="#dc2626">检测：容易（普通CT）</text>
  <text x="60" y="258" font-size="10" fill="#dc2626">故障必须立即切除</text>

  <!-- ====== Method 2: Peterson coil ====== -->
  <rect x="276" y="38" width="248" height="260" fill="white" stroke="#ea580c" stroke-width="1.5" rx="4"/>
  <text x="400" y="60" font-size="12" fill="#ea580c" font-weight="bold" text-anchor="middle">消弧线圈接地</text>

  <g transform="translate(353, 75)">
    <path d="M 0 15 Q 10 8, 0 0 Q -10 8, 0 15 Q 10 22, 0 30 Q -10 38, 0 45 Q 10 52, 0 60" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <path d="M 30 15 Q 40 8, 30 0 Q 20 8, 30 15 Q 40 22, 30 30 Q 20 38, 30 45 Q 40 52, 30 60" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 60 15 Q 70 8, 60 0 Q 50 8, 60 15 Q 70 22, 60 30 Q 50 38, 60 45 Q 70 52, 60 60" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#2563eb" stroke-width="1.2"/>
    <line x1="30" y1="0" x2="30" y2="-12" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="60" y1="0" x2="60" y2="-12" stroke="#dc2626" stroke-width="1.2"/>
    <circle cx="30" cy="65" r="4" fill="#888"/>
    <line x1="30" y1="60" x2="30" y2="65" stroke="#888" stroke-width="1.2"/>

    <!-- Inductor coil symbol -->
    <path d="M 20 75 Q 25 80, 20 85 Q 15 90, 20 95 Q 25 100, 20 105 Q 15 110, 20 115 Q 25 120, 20 125" fill="none" stroke="#ea580c" stroke-width="2"/>
    <text x="42" y="103" font-size="9" fill="#ea580c">L</text>

    <line x1="20" y1="125" x2="20" y2="135" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="10" y1="135" x2="30" y2="135" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="14" y1="140" x2="26" y2="140" stroke="#ea580c" stroke-width="1"/>
    <line x1="16" y1="145" x2="24" y2="145" stroke="#ea580c" stroke-width="0.7"/>

    <text x="-8" y="-16" font-size="9" fill="#2563eb">A</text>
    <text x="22" y="-16" font-size="9" fill="#16a34a">B</text>
    <text x="52" y="-16" font-size="9" fill="#dc2626">C</text>
  </g>

  <!-- Arcing symbol -->
  <text x="395" y="200" font-size="18" fill="#ea580c" text-anchor="middle">⚡</text>

  <text x="318" y="210" font-size="10" fill="#ea580c">L 补偿 Ic → I_fault ≈ 0</text>
  <text x="318" y="226" font-size="10" fill="#ea580c">接地电流：5~15A</text>
  <text x="318" y="242" font-size="10" fill="#ea580c">检测：困难（需暂态/谐波法）</text>
  <text x="318" y="258" font-size="10" fill="#ea580c">瞬时故障可自愈</text>

  <!-- ====== Method 3: Ungrounded ====== -->
  <rect x="534" y="38" width="248" height="260" fill="white" stroke="#8b5cf6" stroke-width="1.5" rx="4"/>
  <text x="658" y="60" font-size="12" fill="#8b5cf6" font-weight="bold" text-anchor="middle">不接地系统</text>

  <g transform="translate(611, 75)">
    <path d="M 0 15 Q 10 8, 0 0 Q -10 8, 0 15 Q 10 22, 0 30 Q -10 38, 0 45 Q 10 52, 0 60" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <path d="M 30 15 Q 40 8, 30 0 Q 20 8, 30 15 Q 40 22, 30 30 Q 20 38, 30 45 Q 40 52, 30 60" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 60 15 Q 70 8, 60 0 Q 50 8, 60 15 Q 70 22, 60 30 Q 50 38, 60 45 Q 70 52, 60 60" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#2563eb" stroke-width="1.2"/>
    <line x1="30" y1="0" x2="30" y2="-12" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="60" y1="0" x2="60" y2="-12" stroke="#dc2626" stroke-width="1.2"/>
    <circle cx="30" cy="65" r="4" fill="#888"/>

    <!-- Broken/open connection from neutral (floating) -->
    <line x1="30" y1="65" x2="30" y2="85" stroke="#888" stroke-width="1.2"/>
    <text x="38" y="72" font-size="9" fill="#8b5cf6">悬空</text>

    <!-- Capacitive coupling to ground (dashed) -->
    <line x1="0" y1="60" x2="10" y2="105" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="2,3"/>
    <text x="-15" y="85" font-size="8" fill="#8b5cf6">C</text>

    <line x1="60" y1="60" x2="70" y2="105" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="2,3"/>
    <text x="64" y="85" font-size="8" fill="#8b5cf6">C</text>

    <!-- Ground symbols -->
    <line x1="8" y1="105" x2="18" y2="105" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="11" y1="110" x2="15" y2="110" stroke="#8b5cf6" stroke-width="0.7"/>
    <line x1="68" y1="105" x2="78" y2="105" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="71" y1="110" x2="75" y2="110" stroke="#8b5cf6" stroke-width="0.7"/>

    <text x="-8" y="-16" font-size="9" fill="#2563eb">A</text>
    <text x="22" y="-16" font-size="9" fill="#16a34a">B</text>
    <text x="52" y="-16" font-size="9" fill="#dc2626">C</text>
  </g>

  <text x="576" y="210" font-size="10" fill="#8b5cf6">中性点悬空，不接地</text>
  <text x="576" y="226" font-size="10" fill="#8b5cf6">接地电流：0.5~5A（仅电容）</text>
  <text x="576" y="242" font-size="10" fill="#8b5cf6">检测：极难（零序过流不可用）</text>
  <text x="576" y="258" font-size="10" fill="#8b5cf6">可带故障运行 2 小时</text>

  <!-- ====== Bottom comparison table ====== -->
  <rect x="18" y="310" width="764" height="60" fill="white" stroke="#ddd" rx="2"/>

  <line x1="18" y1="332" x2="782" y2="332" stroke="#ddd" stroke-width="1"/>

  <text x="142" y="326" font-size="9" fill="#666" text-anchor="middle">零序电流</text>
  <text x="400" y="326" font-size="9" fill="#666" text-anchor="middle">零序电流</text>
  <text x="658" y="326" font-size="9" fill="#666" text-anchor="middle">零序电流</text>

  <text x="142" y="350" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">200 ~ 1000 A</text>
  <text x="400" y="350" font-size="12" fill="#ea580c" font-weight="bold" text-anchor="middle">5 ~ 15 A</text>
  <text x="658" y="350" font-size="12" fill="#8b5cf6" font-weight="bold" text-anchor="middle">0.5 ~ 5 A</text>

  <text x="142" y="366" font-size="9" fill="#666" text-anchor="middle">零序过流可用</text>
  <text x="400" y="366" font-size="9" fill="#666" text-anchor="middle">需暂态/谐波/注入法</text>
  <text x="658" y="366" font-size="9" fill="#666" text-anchor="middle">基本靠 U₀ 判接地</text>
</svg>
