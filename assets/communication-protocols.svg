<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Consolas, monospace">
  <rect width="920" height="320" fill="#fafafa" rx="4"/>

  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">通信协议对比——104 远动与 61850 站内互操作</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 104 side -->
  <rect x="34" y="64" width="360" height="220" fill="white" stroke="#2563eb" stroke-width="1.4" rx="8"/>
  <text x="214" y="88" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">IEC 104</text>
  <text x="214" y="108" font-size="9" fill="#666" text-anchor="middle">主站 ↔ FTU / RTU</text>

  <rect x="60" y="136" width="110" height="46" fill="#eff6ff" rx="6"/>
  <text x="115" y="157" font-size="10" fill="#2563eb" text-anchor="middle">主站</text>
  <text x="115" y="173" font-size="8.5" fill="#666" text-anchor="middle">统一监视</text>

  <rect x="230" y="136" width="110" height="46" fill="#eff6ff" rx="6"/>
  <text x="285" y="157" font-size="10" fill="#2563eb" text-anchor="middle">FTU</text>
  <text x="285" y="173" font-size="8.5" fill="#666" text-anchor="middle">遥测/遥信/遥控</text>

  <line x1="170" y1="159" x2="230" y2="159" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="230" y1="169" x2="170" y2="169" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="200" y="152" font-size="8.5" fill="#2563eb" text-anchor="middle">远动</text>

  <rect x="60" y="212" width="280" height="44" fill="white" stroke="#e5e7eb" rx="6"/>
  <text x="200" y="230" font-size="9" fill="#666" text-anchor="middle">特点：中心化、报文明确、面向调度和远程遥控</text>
  <text x="200" y="246" font-size="9" fill="#666" text-anchor="middle">更像“把现场状态告诉主站”</text>

  <!-- 61850 side -->
  <rect x="526" y="64" width="360" height="220" fill="white" stroke="#7c3aed" stroke-width="1.4" rx="8"/>
  <text x="706" y="88" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle">IEC 61850</text>
  <text x="706" y="108" font-size="9" fill="#666" text-anchor="middle">站内设备 ↔ 设备</text>

  <rect x="548" y="136" width="104" height="46" fill="#f5f3ff" rx="6"/>
  <text x="600" y="157" font-size="10" fill="#7c3aed" text-anchor="middle">保护 IED</text>
  <text x="600" y="173" font-size="8.5" fill="#666" text-anchor="middle">事件驱动</text>

  <rect x="680" y="136" width="104" height="46" fill="#f5f3ff" rx="6"/>
  <text x="732" y="157" font-size="10" fill="#7c3aed" text-anchor="middle">测控 IED</text>
  <text x="732" y="173" font-size="8.5" fill="#666" text-anchor="middle">互操作</text>

  <rect x="812" y="136" width="52" height="46" fill="#f5f3ff" rx="6"/>
  <text x="838" y="157" font-size="10" fill="#7c3aed" text-anchor="middle">GOOSE</text>
  <text x="838" y="173" font-size="8.5" fill="#666" text-anchor="middle">快</text>

  <line x1="652" y1="159" x2="680" y2="159" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowPurple)"/>
  <line x1="784" y1="159" x2="812" y2="159" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

  <rect x="548" y="212" width="282" height="44" fill="white" stroke="#e5e7eb" rx="6"/>
  <text x="689" y="230" font-size="9" fill="#666" text-anchor="middle">特点：对象化、站内协同、事件驱动</text>
  <text x="689" y="246" font-size="9" fill="#666" text-anchor="middle">更像“设备一起表达和响应状态”</text>

  <text x="458" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">本质差异</text>
  <text x="458" y="172" font-size="9" fill="#666" text-anchor="middle">104 偏远动，61850 偏站内互操作</text>
  <text x="458" y="190" font-size="9" fill="#666" text-anchor="middle">一个把状态送出去，一个把状态组织起来</text>
</svg>
