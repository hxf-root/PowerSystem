<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Consolas, monospace">
  <rect width="900" height="280" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="22" font-size="13" font-weight="bold" fill="#1a1a1a">发输变配用——电能的五段旅程</text>

  <!-- Background chain arrow -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="fadeChain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#6b7280" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Central flow arrow -->
  <rect x="30" y="108" width="840" height="4" fill="url(#fadeChain)" rx="2"/>

  <!-- ===== 发电 ===== -->
  <rect x="18" y="42" width="138" height="120" fill="white" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="87" y="62" font-size="11" fill="#dc2626" font-weight="bold" text-anchor="middle">发 电</text>

  <!-- Generator symbol -->
  <g transform="translate(52, 72)">
    <circle cx="35" cy="25" r="28" fill="none" stroke="#dc2626" stroke-width="1.3"/>
    <circle cx="35" cy="25" r="14" fill="none" stroke="#dc2626" stroke-width="1"/>
    <circle cx="35" cy="25" r="3" fill="#dc2626"/>
    <text x="35" y="68" font-size="9" fill="#666" text-anchor="middle">G</text>
  </g>

  <text x="87" y="152" font-size="8.5" fill="#666" text-anchor="middle">10~20kV / 火水核风</text>

  <!-- Arrow 发→变(升) -->
  <line x1="156" y1="102" x2="196" y2="102" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrowRed)"/>

  <!-- ===== 变电（升压） ===== -->
  <rect x="200" y="42" width="138" height="120" fill="white" stroke="#ea580c" stroke-width="1.5" rx="4"/>
  <text x="269" y="56" font-size="10" fill="#ea580c" font-weight="bold" text-anchor="middle">变电（升压）</text>

  <!-- Step-up transformer symbol -->
  <g transform="translate(235, 62)">
    <!-- Primary winding (left, smaller) -->
    <path d="M 8 18 Q 14 12, 8 6 Q 2 0, 8 -6" fill="none" stroke="#ea580c" stroke-width="1.2"/>
    <path d="M 8 38 Q 14 32, 8 26 Q 2 20, 8 14" fill="none" stroke="#ea580c" stroke-width="1.2"/>
    <!-- Secondary winding (right, larger) -->
    <path d="M 42 18 Q 48 12, 42 6 Q 36 0, 42 -6" fill="none" stroke="#ea580c" stroke-width="1.2"/>
    <path d="M 42 45 Q 48 39, 42 33 Q 36 27, 42 21" fill="none" stroke="#ea580c" stroke-width="1.2"/>
    <!-- Core -->
    <line x1="22" y1="0" x2="32" y2="0" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="22" y1="30" x2="32" y2="30" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Labels -->
    <text x="2" y="52" font-size="8" fill="#666" text-anchor="middle">低压</text>
    <text x="48" y="52" font-size="8" fill="#666" text-anchor="middle">高压</text>
  </g>

  <text x="269" y="152" font-size="8.5" fill="#666" text-anchor="middle">10kV→500kV/220kV</text>

  <!-- Arrow 变(升)→输 -->
  <line x1="338" y1="102" x2="378" y2="102" stroke="#ea580c" stroke-width="1.3" marker-end="url(#arrowOrange)"/>

  <!-- ===== 输电 ===== -->
  <rect x="382" y="42" width="138" height="120" fill="white" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="451" y="62" font-size="11" fill="#2563eb" font-weight="bold" text-anchor="middle">输 电</text>

  <!-- Transmission tower symbol -->
  <g transform="translate(413, 72)">
    <!-- Tower -->
    <line x1="35" y1="5" x2="35" y2="45" stroke="#2563eb" stroke-width="1.3"/>
    <line x1="15" y1="24" x2="55" y2="24" stroke="#2563eb" stroke-width="1"/>
    <line x1="20" y1="24" x2="12" y2="8" stroke="#2563eb" stroke-width="0.8"/>
    <line x1="50" y1="24" x2="58" y2="8" stroke="#2563eb" stroke-width="0.8"/>
    <line x1="12" y1="8" x2="58" y2="8" stroke="#2563eb" stroke-width="1"/>
    <!-- Wires to next tower -->
    <line x1="58" y1="8" x2="82" y2="8" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="6,3"/>
    <line x1="35" y1="5" x2="82" y2="5" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="6,3"/>
  </g>

  <text x="451" y="152" font-size="8.5" fill="#666" text-anchor="middle">500/220kV · 数百km</text>

  <!-- Arrow 输→变(降) -->
  <line x1="520" y1="102" x2="560" y2="102" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrowBlue)"/>

  <!-- ===== 变电（降压） ===== -->
  <rect x="564" y="42" width="138" height="120" fill="white" stroke="#16a34a" stroke-width="1.5" rx="4"/>
  <text x="633" y="56" font-size="10" fill="#16a34a" font-weight="bold" text-anchor="middle">变电（降压）</text>

  <!-- Step-down transformer symbol -->
  <g transform="translate(599, 62)">
    <path d="M 8 18 Q 14 12, 8 6 Q 2 0, 8 -6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 8 38 Q 14 32, 8 26 Q 2 20, 8 14" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 42 18 Q 48 12, 42 6 Q 36 0, 42 -6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <path d="M 42 38 Q 48 32, 42 26 Q 36 20, 42 14" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="22" y1="-2" x2="32" y2="-2" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="22" y1="28" x2="32" y2="28" stroke="#16a34a" stroke-width="1.5"/>
    <text x="2" y="50" font-size="8" fill="#666" text-anchor="middle">高压</text>
    <text x="48" y="50" font-size="8" fill="#666" text-anchor="middle">低压</text>
  </g>

  <text x="633" y="152" font-size="8.5" fill="#666" text-anchor="middle">220kV→110kV/35kV</text>

  <!-- Arrow 变(降)→配 -->
  <line x1="702" y1="102" x2="732" y2="102" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrowGreen)"/>

  <!-- ===== 配电 ===== -->
  <rect x="736" y="42" width="70" height="120" fill="white" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="771" y="62" font-size="11" fill="#7c3aed" font-weight="bold" text-anchor="middle">配电</text>

  <g transform="translate(750, 72)">
    <!-- Distribution pole -->
    <line x1="20" y1="0" x2="20" y2="42" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="5" y1="10" x2="35" y2="10" stroke="#7c3aed" stroke-width="0.8"/>
    <line x1="5" y1="20" x2="35" y2="20" stroke="#7c3aed" stroke-width="0.8"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#7c3aed" stroke-width="0.8"/>
    <!-- FTU -->
    <rect x="0" y="38" width="40" height="12" fill="none" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <text x="20" y="47" font-size="7" fill="#f59e0b" text-anchor="middle">FTU</text>
  </g>

  <text x="771" y="152" font-size="8.5" fill="#666" text-anchor="middle">10kV</text>

  <!-- Arrow 配→用 -->
  <line x1="806" y1="102" x2="830" y2="102" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowPurple)"/>

  <!-- ===== 用电 ===== -->
  <rect x="834" y="42" width="54" height="120" fill="white" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="861" y="62" font-size="11" fill="#6b7280" font-weight="bold" text-anchor="middle">用电</text>

  <g transform="translate(846, 72)">
    <!-- House/household -->
    <rect x="6" y="8" width="18" height="16" fill="none" stroke="#6b7280" stroke-width="1"/>
    <polygon points="15,2 6,8 24,8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <!-- Factory -->
    <rect x="30" y="20" width="14" height="10" fill="none" stroke="#6b7280" stroke-width="1"/>
    <polygon points="37,14 30,20 44,20" fill="none" stroke="#6b7280" stroke-width="1"/>
    <rect x="32" y="23" width="3" height="3" fill="#6b7280"/>
    <rect x="38" y="23" width="3" height="3" fill="#6b7280"/>
  </g>

  <text x="861" y="152" font-size="8.5" fill="#666" text-anchor="middle">380/220V</text>

  <!-- ===== Bottom: Key stats row ===== -->
  <rect x="18" y="180" width="870" height="90" fill="white" stroke="#e5e7eb" stroke-width="1" rx="4"/>

  <text x="30" y="200" font-size="11" fill="#1a1a1a" font-weight="bold">各段关键参数</text>

  <!-- Column headers -->
  <g transform="translate(30, 212)">
    <text x="0" y="14" font-size="9" fill="#666">电压等级</text>
    <text x="0" y="28" font-size="9" fill="#666">典型距离</text>
    <text x="0" y="42" font-size="9" fill="#666">核心设备</text>
  </g>

  <!-- 发电 column -->
  <g transform="translate(100, 212)">
    <text x="0" y="14" font-size="9" fill="#dc2626">10~20 kV</text>
    <text x="0" y="28" font-size="9" fill="#666">—</text>
    <text x="0" y="42" font-size="9" fill="#666">同步发电机</text>
  </g>

  <!-- 变电升压 column -->
  <g transform="translate(210, 212)">
    <text x="0" y="14" font-size="9" fill="#ea580c">10→500/220 kV</text>
    <text x="0" y="28" font-size="9" fill="#666">—</text>
    <text x="0" y="42" font-size="9" fill="#666">升压变压器</text>
  </g>

  <!-- 输电 column -->
  <g transform="translate(360, 212)">
    <text x="0" y="14" font-size="9" fill="#2563eb">500/220 kV</text>
    <text x="0" y="28" font-size="9" fill="#666">100~2000 km</text>
    <text x="0" y="42" font-size="9" fill="#666">铁塔/导线/绝缘子</text>
  </g>

  <!-- 变电降压 column -->
  <g transform="translate(510, 212)">
    <text x="0" y="14" font-size="9" fill="#16a34a">220→110/35 kV</text>
    <text x="0" y="28" font-size="9" fill="#666">—</text>
    <text x="0" y="42" font-size="9" fill="#666">降压变压器</text>
  </g>

  <!-- 配电 column -->
  <g transform="translate(650, 212)">
    <text x="0" y="14" font-size="9" fill="#7c3aed">10 kV</text>
    <text x="0" y="28" font-size="9" fill="#666">2~10 km</text>
    <text x="0" y="42" font-size="9" fill="#666">柱上开关/FTU</text>
  </g>

  <!-- 用电 column -->
  <g transform="translate(760, 212)">
    <text x="0" y="14" font-size="9" fill="#6b7280">380/220 V</text>
    <text x="0" y="28" font-size="9" fill="#666">100~500 m</text>
    <text x="0" y="42" font-size="9" fill="#666">配电变压器</text>
  </g>

  <!-- Loss formula reminder at bottom -->
  <text x="465" y="262" font-size="8.5" fill="#9ca3af" text-anchor="middle">P_loss = I²R = (P/U)²R ∝ 1/U² ——电压升高k倍，损耗降低k²倍</text>
</svg>
