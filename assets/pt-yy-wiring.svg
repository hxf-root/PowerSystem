<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Consolas, monospace">
  <rect width="520" height="340" fill="#fafafa" rx="4"/>
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">Y-Y 接线（三台单相 PT，星形接法）</text>
  <text x="18" y="42" font-size="10" fill="#888">可测相电压 Ua/Ub/Uc 和线电压，中性点接地</text>

  <!-- Phase buses -->
  <line x1="40" y1="75" x2="460" y2="75" stroke="#2563eb" stroke-width="2.5"/>
  <text x="20" y="79" font-size="12" fill="#2563eb" font-weight="bold">A</text>

  <line x1="40" y1="150" x2="460" y2="150" stroke="#16a34a" stroke-width="2.5"/>
  <text x="20" y="154" font-size="12" fill="#16a34a" font-weight="bold">B</text>

  <line x1="40" y1="225" x2="460" y2="225" stroke="#dc2626" stroke-width="2.5"/>
  <text x="20" y="229" font-size="12" fill="#dc2626" font-weight="bold">C</text>

  <!-- Neutral line (bottom) -->
  <line x1="40" y1="300" x2="460" y2="300" stroke="#888" stroke-width="2"/>
  <text x="20" y="304" font-size="12" fill="#888" font-weight="bold">N</text>

  <!-- PT A -->
  <g transform="translate(120, 65)">
    <path d="M 10 10 L 10 22 Q 22 28, 10 35 Q -2 42, 10 50 Q 22 58, 10 65 Q -2 72, 10 80 L 10 92" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="10" cy="52" r="3" fill="#2563eb"/>
    <line x1="0" y1="10" x2="10" y2="10" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="0" y1="92" x2="10" y2="92" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- PT B -->
  <g transform="translate(200, 140)">
    <path d="M 10 10 L 10 22 Q 22 28, 10 35 Q -2 42, 10 50 Q 22 58, 10 65 Q -2 72, 10 80 L 10 92" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="10" cy="52" r="3" fill="#16a34a"/>
    <line x1="0" y1="10" x2="10" y2="10" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="0" y1="92" x2="10" y2="92" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- PT C -->
  <g transform="translate(280, 215)">
    <path d="M 10 10 L 10 22 Q 22 28, 10 35 Q -2 42, 10 50 Q 22 58, 10 65 Q -2 72, 10 80 L 10 92" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="10" cy="52" r="3" fill="#dc2626"/>
    <line x1="0" y1="10" x2="10" y2="10" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="0" y1="92" x2="10" y2="92" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- Neutral connection point -->
  <circle cx="200" cy="307" r="4" fill="#888"/>
  <circle cx="280" cy="307" r="4" fill="#888"/>
  <circle cx="120" cy="162" r="4" fill="#888"/>

  <!-- Neutral interconnections (vertical lines down to N bus) -->
  <line x1="120" y1="162" x2="120" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="200" y1="242" x2="200" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="312" x2="280" y2="300" stroke="#888" stroke-width="1.5"/>

  <!-- Ground symbol on neutral -->
  <line x1="380" y1="300" x2="400" y2="300" stroke="#888" stroke-width="1.5"/>
  <line x1="390" y1="305" x2="390" y2="315" stroke="#888" stroke-width="1.5"/>
  <line x1="382" y1="315" x2="398" y2="315" stroke="#888" stroke-width="1.5"/>
  <line x1="385" y1="320" x2="395" y2="320" stroke="#888" stroke-width="1"/>
  <text x="405" y="315" font-size="10" fill="#888">中性点接地</text>

  <!-- Secondary outputs -->
  <line x1="280" y1="120" x2="420" y2="120" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="124" font-size="11" fill="#2563eb" font-weight="bold">a</text>

  <line x1="300" y1="200" x2="420" y2="200" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="204" font-size="11" fill="#16a34a" font-weight="bold">b</text>

  <line x1="320" y1="277" x2="420" y2="277" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="281" font-size="11" fill="#dc2626" font-weight="bold">c</text>

  <line x1="350" y1="300" x2="420" y2="300" stroke="#888" stroke-width="1.5"/>
  <text x="430" y="304" font-size="11" fill="#888" font-weight="bold">n</text>

  <!-- Notes -->
  <text x="40" y="332" font-size="10" fill="#666">特点：可测相电压 + 线电压，需要三台 PT，适合检测零序电压</text>
</svg>
