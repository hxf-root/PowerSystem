<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="Consolas, monospace">
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRightRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="700" height="230" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">CT（电流互感器）原理</text>

  <!-- Primary side label -->
  <text x="18" y="54" font-size="11" fill="#2563eb" font-weight="bold">一次侧（母线/线路）</text>
  <text x="18" y="70" font-size="10" fill="#666">1 匝，几百~几千 A</text>

  <!-- Secondary side label -->
  <text x="490" y="54" font-size="11" fill="#dc2626" font-weight="bold">二次侧（FTU 采样）</text>
  <text x="490" y="70" font-size="10" fill="#666">N 匝，5A 或 1A</text>

  <!-- Iron core -->
  <rect x="240" y="80" width="160" height="120" rx="8" fill="none" stroke="#555" stroke-width="2.5"/>
  <rect x="250" y="90" width="140" height="100" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1"/>

  <!-- Primary conductor (thick line through core) -->
  <line x1="40" y1="140" x2="240" y2="140" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <!-- dot marking P1 -->
  <circle cx="60" cy="130" r="4" fill="#2563eb"/>
  <text x="40" y="120" font-size="10" fill="#2563eb" font-weight="bold">P1</text>

  <line x1="400" y1="140" x2="560" y2="140" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="565" y="144" font-size="10" fill="#2563eb" font-weight="bold">P2</text>

  <!-- Secondary winding (multiple turns around core) -->
  <path d="M 400 95
           Q 385 95, 385 100
           L 385 110
           Q 385 115, 400 115
           L 420 115
           Q 435 115, 435 120
           L 435 130
           Q 435 135, 420 135
           L 400 135
           Q 385 135, 385 140
           L 385 150
           Q 385 155, 400 155
           L 420 155
           Q 435 155, 435 160
           L 435 170
           Q 435 175, 420 175
           L 400 175
           Q 385 175, 385 180
           L 385 185"
        fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>

  <!-- Secondary leads -->
  <line x1="400" y1="95" x2="560" y2="95" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="565" y="99" font-size="10" fill="#dc2626" font-weight="bold">S1</text>

  <line x1="400" y1="185" x2="560" y2="185" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="565" y="189" font-size="10" fill="#dc2626" font-weight="bold">S2</text>

  <!-- Current arrows -->
  <line x1="120" y1="135" x2="210" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowRight)"/>
  <text x="135" y="128" font-size="11" fill="#2563eb" font-weight="bold">I₁</text>

  <line x1="420" y1="105" x2="520" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRightRed)"/>
  <text x="440" y="100" font-size="11" fill="#dc2626" font-weight="bold">I₂ = I₁/K</text>

  <!-- Flux label -->
  <text x="295" y="155" font-size="11" fill="#8b5cf6" font-weight="bold" text-anchor="middle">Φ</text>
  <text x="295" y="170" font-size="9" fill="#999" text-anchor="middle">磁通</text>

  <!-- Bottom formula -->
  <rect x="120" y="208" width="400" height="18" fill="white" stroke="#ddd" rx="2"/>
  <text x="320" y="221" font-size="11" fill="#333" text-anchor="middle" font-family="Consolas, monospace">I₁ × N₁ = I₂ × N₂ （安匝平衡）</text>
</svg>
