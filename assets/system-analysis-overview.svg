<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Consolas, monospace">
  <rect width="900" height="320" fill="#fafafa" rx="4"/>

  <text x="18" y="24" font-size="13" font-weight="bold" fill="#1a1a1a">系统分析总览——潮流、短路、稳定性如何连接 FTU</text>

  <defs>
    <marker id="arrowGray" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Central FTU box -->
  <rect x="340" y="94" width="220" height="132" fill="white" stroke="#1f2937" stroke-width="1.6" rx="8"/>
  <text x="450" y="122" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle">FTU / 主站分析链</text>
  <text x="450" y="146" font-size="9" fill="#666" text-anchor="middle">采样 → 计算 → 判断 → 动作</text>
  <text x="450" y="170" font-size="9" fill="#666" text-anchor="middle">U / I / P / Q / 3I0 / 负序</text>
  <rect x="378" y="184" width="144" height="22" fill="#f3f4f6" rx="4"/>
  <text x="450" y="199" font-size="9" fill="#1f2937" text-anchor="middle">系统状态估计 / 保护判据 / FA 策略</text>

  <!-- Left panel: load flow -->
  <rect x="28" y="58" width="232" height="210" fill="white" stroke="#2563eb" stroke-width="1.4" rx="6"/>
  <text x="144" y="82" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">潮流</text>
  <text x="144" y="102" font-size="9" fill="#666" text-anchor="middle">平时怎么走</text>
  <line x1="60" y1="128" x2="220" y2="128" stroke="#6b7280" stroke-width="2"/>
  <circle cx="82" cy="128" r="10" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="144" cy="128" r="10" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="206" cy="128" r="10" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="92" y1="128" x2="134" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="154" y1="128" x2="196" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="82" y="150" font-size="8.5" fill="#666" text-anchor="middle">U₁</text>
  <text x="144" y="150" font-size="8.5" fill="#666" text-anchor="middle">P, Q</text>
  <text x="206" y="150" font-size="8.5" fill="#666" text-anchor="middle">U₂</text>
  <text x="144" y="174" font-size="8.5" fill="#2563eb" text-anchor="middle">压降、负荷率、线损</text>
  <text x="144" y="196" font-size="8.5" fill="#666" text-anchor="middle">用于判断过载和转供能力</text>
  <text x="144" y="228" font-size="8.5" fill="#666" text-anchor="middle">对应：潮流计算</text>

  <!-- Right top panel: short circuit -->
  <rect x="640" y="58" width="232" height="210" fill="white" stroke="#dc2626" stroke-width="1.4" rx="6"/>
  <text x="756" y="82" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">短路</text>
  <text x="756" y="102" font-size="9" fill="#666" text-anchor="middle">出事时电流多大</text>
  <circle cx="690" cy="136" r="16" fill="none" stroke="#dc2626" stroke-width="1.3"/>
  <text x="690" y="140" font-size="10" fill="#dc2626" text-anchor="middle">Z</text>
  <line x1="706" y1="136" x2="786" y2="136" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="788" y="126" width="48" height="20" fill="#fef2f2" stroke="#dc2626" rx="4"/>
  <text x="812" y="140" font-size="9" fill="#dc2626" text-anchor="middle">I_fault</text>
  <line x1="690" y1="152" x2="690" y2="192" stroke="#6b7280" stroke-width="1.4"/>
  <rect x="652" y="192" width="84" height="22" fill="#fff7ed" rx="4"/>
  <text x="694" y="207" font-size="8.5" fill="#ea580c" text-anchor="middle">保护整定 / 开断能力</text>
  <text x="756" y="228" font-size="8.5" fill="#666" text-anchor="middle">对应：短路分析</text>
  <text x="756" y="248" font-size="8.5" fill="#666" text-anchor="middle">零序、负序、三相短路</text>

  <!-- Right bottom panel: stability -->
  <rect x="640" y="272" width="232" height="0" fill="none"/>

  <!-- Bottom panel: stability -->
  <rect x="314" y="246" width="272" height="58" fill="white" stroke="#7c3aed" stroke-width="1.4" rx="6"/>
  <text x="450" y="268" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle">稳定性</text>
  <text x="450" y="286" font-size="9" fill="#666" text-anchor="middle">切完之后还能不能稳住</text>
  <path d="M 344 294 C 378 280, 408 308, 442 294 S 506 280, 540 294" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="450" y="308" font-size="8.5" fill="#666" text-anchor="middle">频率稳定 | 电压稳定 | 功角稳定</text>

  <!-- Arrows from panels to FTU -->
  <line x1="260" y1="154" x2="340" y2="150" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <line x1="640" y1="154" x2="560" y2="150" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <line x1="450" y1="246" x2="450" y2="226" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <!-- Footer note -->
  <rect x="28" y="272" width="232" height="36" fill="#eff6ff" rx="4"/>
  <text x="144" y="294" font-size="9" fill="#2563eb" text-anchor="middle">潮流：看平时</text>
  <text x="144" y="307" font-size="9" fill="#2563eb" text-anchor="middle">短路：看故障</text>

  <rect x="640" y="272" width="232" height="36" fill="#f5f3ff" rx="4"/>
  <text x="756" y="294" font-size="9" fill="#7c3aed" text-anchor="middle">稳定性：看切除后是否继续正常运行</text>
</svg>
