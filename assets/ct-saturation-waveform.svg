<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Consolas, monospace">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="4"/>

  <!-- ====== 1st waveform: 一次电流 I1 ====== -->
  <text x="16" y="22" font-size="13" font-weight="bold" fill="#1a1a1a">一次电流 I₁（真实值）</text>
  <rect x="16" y="32" width="768" height="110" fill="white" stroke="#ccc" rx="2"/>

  <!-- Axes -->
  <line x1="40" y1="87" x2="770" y2="87" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="37" x2="40" y2="137" stroke="#999" stroke-width="1"/>

  <!-- Sine wave: I1 -->
  <path d="M 40 87
           C 64 87, 95 37, 131 37
           C 167 37, 198 87, 234 87
           C 270 87, 301 137, 337 137
           C 373 137, 404 87, 440 87
           C 476 87, 507 37, 543 37
           C 579 37, 610 87, 646 87
           C 682 87, 713 137, 749 137"
        fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Labels -->
  <text x="754" y="82" font-size="11" fill="#2563eb">I₁</text>
  <text x="355" y="68" font-size="10" fill="#888">峰值区的完整正弦波</text>

  <!-- ====== 2nd waveform: 二次电流 I2 正常 ====== -->
  <text x="16" y="166" font-size="13" font-weight="bold" fill="#1a1a1a">二次电流 I₂（正常）</text>
  <rect x="16" y="176" width="768" height="110" fill="white" stroke="#ccc" rx="2"/>

  <!-- Axes -->
  <line x1="40" y1="231" x2="770" y2="231" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="181" x2="40" y2="281" stroke="#999" stroke-width="1"/>

  <!-- Sine wave: I2 normal (scaled replica) -->
  <path d="M 40 231
           C 64 231, 95 181, 131 181
           C 167 181, 198 231, 234 231
           C 270 231, 301 281, 337 281
           C 373 281, 404 231, 440 231
           C 476 231, 507 181, 543 181
           C 579 181, 610 231, 646 231
           C 682 231, 713 281, 749 281"
        fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow: scaled copy -->
  <line x1="706" y1="218" x2="756" y2="195" stroke="#16a34a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="710" y="214" font-size="10" fill="#16a34a">等比例缩小</text>

  <!-- ====== 3rd waveform: 二次电流 I2 饱和 ====== -->
  <text x="16" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">二次电流 I₂（CT 饱和）</text>
  <rect x="16" y="320" width="768" height="110" fill="white" stroke="#ccc" rx="2"/>

  <!-- Axes -->
  <line x1="40" y1="375" x2="770" y2="375" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="325" x2="40" y2="425" stroke="#999" stroke-width="1"/>

  <!-- Clipped sine wave: saturation -->
  <!-- First half cycle: normal rise, then flat top, then normal fall -->
  <!-- Going up from 0 -->
  <path d="M 40 375
           C 64 375, 95 325, 131 325
           Q 138 325, 144 325"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flat top (saturated) -->
  <line x1="144" y1="325" x2="224" y2="325" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Coming down -->
  <path d="M 224 325
           Q 230 325, 234 330
           C 250 365, 285 375, 310 375"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Going down (negative half) -->
  <path d="M 310 375
           C 335 375, 370 385, 386 420
           Q 390 425, 396 425"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flat bottom (saturated) -->
  <line x1="396" y1="425" x2="476" y2="425" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Coming back up -->
  <path d="M 476 425
           Q 482 425, 486 420
           C 502 385, 537 375, 562 375"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Second cycle (same pattern) -->
  <path d="M 562 375
           C 587 375, 622 385, 638 420
           Q 642 425, 648 425"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="648" y1="425" x2="728" y2="425" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Fade out -->
  <path d="M 728 425
           Q 734 425, 738 420
           C 746 405, 749 390, 749 375"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Annotations -->
  <text x="160" y="317" font-size="10" fill="#dc2626">削顶</text>
  <line x1="184" y1="319" x2="184" y2="325" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="2,2"/>

  <text x="420" y="318" font-size="10" fill="#dc2626">削底</text>
  <line x1="436" y1="419" x2="436" y2="425" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Label -->
  <text x="695" y="395" font-size="11" fill="#dc2626">波峰被削掉，仅过零点附近正常</text>

  <!-- ====== Legend at bottom ====== -->
  <rect x="16" y="448" width="768" height="56" fill="white" stroke="#ccc" rx="2"/>
  <text x="40" y="472" font-size="12" fill="#1a1a1a">铁芯工作区：</text>

  <!-- Linear region -->
  <rect x="140" y="460" width="70" height="18" fill="#16a34a" opacity="0.15" rx="2"/>
  <text x="148" y="473" font-size="10" fill="#16a34a">线性区 ✓</text>

  <text x="225" y="473" font-size="10" fill="#666">→ 饱和区 ✗</text>

  <!-- Small saturation curve illustration -->
  <g transform="translate(360, 456)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="40" x2="60" y2="40" stroke="#999" stroke-width="1"/>
    <text x="22" y="52" font-size="9" fill="#888">励磁电流 I_ex</text>
    <text x="-35" y="22" font-size="9" fill="#888" transform="rotate(-90, -35, 22)">磁通 Φ</text>

    <!-- B-H curve: linear then saturation -->
    <path d="M 0 40 L 15 10 L 30 5 Q 40 3, 45 3 L 60 2"
          fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- Dotted line marking saturation knee -->
    <line x1="30" y1="5" x2="30" y2="40" stroke="#999" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="32" y="30" font-size="8" fill="#888">拐点</text>
  </g>

  <text x="550" y="473" font-size="10" fill="#666">— 一次电流 > 拐点 → 饱和 → 波形削顶</text>
  <text x="550" y="492" font-size="10" fill="#666">— 过零点附近：励磁电流小，仍在线性区，波形正常</text>
</svg>
