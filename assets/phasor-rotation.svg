<svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- 相量图（左侧） -->
  <circle cx="80" cy="90" r="70" fill="none" stroke="#ddd" stroke-width="1"/>
  <line x1="10" y1="90" x2="150" y2="90" stroke="#ccc" stroke-dasharray="3,3"/>
  <line x1="80" y1="20" x2="80" y2="160" stroke="#ccc" stroke-dasharray="3,3"/>
  <text x="80" y="15" text-anchor="middle" fill="#888" font-size="11">Im</text>
  <text x="155" y="94" fill="#888" font-size="11">Re</text>
  <!-- 旋转相量 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 80 90" to="360 80 90" dur="3s" repeatCount="indefinite"/>
    <line x1="80" y1="90" x2="145" y2="90" stroke="#e06c75" stroke-width="2.5"/>
    <circle cx="145" cy="90" r="4" fill="#e06c75"/>
    <text x="150" y="80" fill="#e06c75" font-size="12" font-weight="bold">U·</text>
  </g>
  <text x="80" y="175" text-anchor="middle" fill="#999" font-size="11">旋转相量 U∠φ</text>
  <!-- 正弦波（右侧） -->
  <path d="M 155,90 Q 175,20 195,90 T 235,90 T 275,90 T 315,90 T 355,90" fill="none" stroke="#61afef" stroke-width="2" opacity="0.6"/>
  <line x1="155" y1="90" x2="355" y2="90" stroke="#ccc" stroke-dasharray="3,3"/>
  <text x="255" y="175" text-anchor="middle" fill="#999" font-size="11">对应波形 u(t) = Um·sin(ωt+φ)</text>
</svg>
